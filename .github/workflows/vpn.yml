name: 'Virtualized Android Emulator'
on:
  workflow_dispatch:

  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Check OpenVPN log locations
        run: |
          sudo ls -la /var/log/openvpn
          sudo ls -la /etc/openvpn
          sudo find /var/log -name "*openvpn*"