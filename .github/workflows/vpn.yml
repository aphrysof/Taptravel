name: 'Virtualized Android Emulator'
on:
  workflow_dispatch:

  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved
          echo "Verifying update-systemd-resolved script exists:"
          ls -l /etc/openvpn/update-systemd-resolved || echo "File not found"
          sudo ln -s /usr/lib/openvpn/update-systemd-resolved /etc/openvpn/update-systemd-resolved || echo "Creating symlink"

      - name: Write OpenVPN config from secret
        run: |
          echo "${{ secrets.ANTARCTICA_DEV_OPENVPN_FILE }}" > client.ovpn
          echo "=== Checking original config content (first few lines) ==="
          head -n 5 client.ovpn
          
          # Add DNS resolution settings at the beginning of the file
          sed -i '1i script-security 2\nup /etc/openvpn/update-systemd-resolved\ndown /etc/openvpn/update-systemd-resolved' client.ovpn
          
          echo "=== Verifying final config (without sensitive data) ==="
          grep -i "script\|systemd" client.ovpn
          sudo chmod 600 client.ovpn


      - name: Check OpenVPN log locations
        run: |
          echo "=== Searching for OpenVPN log files ==="
          ls -la
          sudo ls -la /etc/openvpn

      - name: Start OpenVPN
        run: |
          
          echo "=== Starting OpenVPN ==="
          sudo openvpn --config client.ovpn --daemon --log /tmp/openvpn.log --writepid /tmp/openvpn.pid --verb 4
          sleep 5
          
          echo "=== OpenVPN Log Content ==="
          sudo cat /tmp/openvpn.log
          

        