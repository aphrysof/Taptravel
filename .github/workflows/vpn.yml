name: 'Virtualized Android Emulator'
on:
  workflow_dispatch:

  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Write OpenVPN config from secret
        run: |
          # First write the base config from secret
          echo "${{ secrets.ANTARCTICA_DEV_OPENVPN_FILE }}" > client.ovpn
          
          echo "=== Adding DNS resolution settings ==="
          # Create a temporary file with our additional settings
          cat << 'EOF' > dns-settings.txt
          script-security 2
          up /etc/openvpn/update-systemd-resolved
          down /etc/openvpn/update-systemd-resolved
          EOF
          # Combine the files
          cat dns-settings.txt client.ovpn > temp.ovpn && mv temp.ovpn client.ovpn
          rm dns-settings.txt
          
          echo "=== Verifying the final config (showing only the DNS settings) ==="
          echo "First 10 lines of client.ovpn:"
          head -n 10 client.ovpn
          

      - name: Start OpenVPN
        run: |
          
          echo "=== Starting OpenVPN ==="
          sudo openvpn --config client.ovpn --daemon --log /tmp/openvpn.log --writepid /tmp/openvpn.pid


      - name: Validate VPN Connecction
        run: |
          if resolvectl status | grep -q "Link.*(tun0)"; then
            echo "Success: tun0 interface is configured correctly in systemd-resolved."
            exit 0
          else
            echo "Error: tun0 interface not found in resolvectl status."
            exit 1
          fi



          

        