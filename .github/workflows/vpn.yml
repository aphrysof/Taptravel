name: 'Virtualized Android Emulator'
on:
  workflow_dispatch:

  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved
          echo "Verifying update-systemd-resolved script exists:"
          ls -l /etc/openvpn/update-systemd-resolved || echo "File not found"
          sudo ln -s /usr/lib/openvpn/update-systemd-resolved /etc/openvpn/update-systemd-resolved || echo "Creating symlink"

      - name: Write OpenVPN config from secret
        run: |
          echo "${{ secrets.ANTARCTICA_DEV_OPENVPN_FILE }}" > client.ovpn
          cat <<EOF >> client.ovpn
          script-security 2
          up /etc/openvpn/update-systemd-resolved
          down /etc/openvpn/update-systemd-resolved
          EOF

      - name: Check OpenVPN log locations
        run: |
          echo "=== Searching for OpenVPN log files ==="
          ls -la
          sudo ls -la /var/log/openvpn
          sudo ls -la /etc/openvpn
          sudo find /var/log -name "*openvpn*"

      - name: Start OpenVPN
        run: |
          sudo openvpn --config client.ovpn --daemon --log /tmp/openvpn.log --writepid /tmp/openvpn.pid
          sudo cat openvpn.log
        