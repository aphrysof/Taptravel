name: 'Virtualized Android Emulator'
on:
  workflow_dispatch:

  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Write OpenVPN config from secret
        run: |
          # First create DNS settings with proper indentation
          cat << 'EOF' > dns-settings.txt
          script-security 2
          up /etc/openvpn/update-systemd-resolved
          down /etc/openvpn/update-systemd-resolved
          dhcp-option DOMAIN-ROUTE .
          EOF
          
          # Write the base config
          echo "${{ secrets.ANTARCTICA_DEV_OPENVPN_FILE }}" > client.ovpn
          
          echo "=== Current config state ==="
          echo "1. DNS settings to be added:"
          cat dns-settings.txt
          
          echo "2. Adding DNS settings to config"
          cat dns-settings.txt client.ovpn > temp.ovpn
          mv temp.ovpn client.ovpn
          rm dns-settings.txt
          
          echo "3. Verifying config structure (non-sensitive parts):"
          grep -A 3 "script-security" client.ovpn
          

      - name: Start OpenVPN
        run: |
          echo "=== Checking OpenVPN config before start ==="

                    
          echo "3. Starting OpenVPN with verbose logging:"
          sudo openvpn --config client.ovpn --daemon --log /tmp/openvpn.log --writepid /tmp/openvpn.pid --verb 4
          sleep 5
          
          echo "4. Checking if OpenVPN process is running:"
          ps aux | grep openvpn
          
          echo "5. Checking OpenVPN logs:"
          sudo cat /tmp/openvpn.log





          

        